name: deploy book to github pages

on:
  workflow_dispatch:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:  
      - uses: actions/checkout@v7.0.0
      - name: install tools
        uses: taiki-e/install-action@v2.82.5
        with:
          tool: mdbook
      - name: build
        run: mdbook build
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6  
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ./target/book
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
