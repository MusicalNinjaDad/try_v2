name: Deploy Rust
concurrency: Crates.io

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  quality-check:
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/rust-stability.yml

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
    - uses: actions/checkout@v6.0.3
    - name: install tools
      uses: taiki-e/install-action@v2.81.10
      with:
        tool: |
          jaq
          parse-changelog
    - id: version
      name: get version
      run: |
        v="$(jaq -cr .package.version crates/try_v2/Cargo.toml)"
        echo "try_v2 version: $v"

        derive_version="$(jaq -cr .workspace.dependencies.try_v2_derive.version Cargo.toml)"
        traits_version="$(jaq -cr .workspace.dependencies.try_v2_traits.version Cargo.toml)"
        
        [[ "$derive_version" == "$v" ]] || {
          echo "::error title=try_v2_derive version mismatch::expected $v, got $derive_version"
          exit 1
        }
        
        [[ "$traits_version" == "$v" ]] || {
          echo "::error title=try_v2_traits version mismatch::expected $v, got $traits_version"
          exit 1
        }
        
        echo "version=$v" >> $GITHUB_OUTPUT
    - id: changelog
      name: validate changelog
      run: parse-changelog CHANGELOG.md ${{ steps.version.outputs.version }}

  publish_lib:
    needs:
      - version
      - quality-check
    if: ${{ !(failure() || cancelled()) }}
    environment: crates.io
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6.0.3
    # Install manually as different crates may have custom toolchains defined
    - name: install rust
      run: rustup set profile default && rustup install
    # Use OIDC for updating existing crates
    - uses: rust-lang/crates-io-auth-action@bbd81622f20ce9e2dd9622e3218b975523e45bbe #v1.0.4
      id: auth
    - name: Publish
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      run:
        cargo publish

  github_release:
    env:
      GH_TOKEN: ${{ github.token }}
    permissions:
      attestations: write
      contents: write
    needs:
      - version
      - publish_lib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - name: install tools
        uses: taiki-e/install-action@v2.81.10
        with:
          tool: parse-changelog
      - name: publish release
        run: parse-changelog CHANGELOG.md ${{ needs.version.outputs.version }} | gh release create v${{ needs.version.outputs.version }} --notes-file -
