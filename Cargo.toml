[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.11.1"
edition = "2024"
readme = "README.md"
authors = ["Mike Foster <https://github.com/MusicalNinjaDad>"]
keywords = ["derive", "Try", "try_trait_v2"]
repository = "https://github.com/MusicalNinjaDad/try_v2"
categories = ["development-tools"]
license = "MIT"
rust-version = "1.93.1"
exclude = [".github", ".devcontainer"]

[workspace.dependencies]
try_v2_derive = { path = "crates/try_v2_derive", version = "=0.11.1" }
try_v2_traits = { path = "crates/try_v2_traits", version = "=0.11.1" }

build_safely = "0.6.1"

[patch.crates-io]
proc_macro2_diagnostic = {git = "https://github.com/MusicalNinjaDad/proc_macro2_diagnostic", branch = "prep_v0.8.1"}
